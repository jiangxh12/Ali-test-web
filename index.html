        @media (max-width: 820px) {

    <script>
    // ═══════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════
    // 关键词库与权重配置
    // ═══════════════════════════════════════════════════════════
    const PARTY_A_LEANING_WORDS = {

        '投诉': 5, '质量问题': 8, '货不对板': 9, '缺斤少两': 8,

        '虚假宣传': 9, '售后不理': 7, '拒绝退款': 8, '强制消费': 9,
        '洒了': 6, '撒漏': 6, '破损': 6, '少了': 5, '漏发': 7,
        '发错': 7, '色差': 5, '开线': 6, '掉色': 6, '褪色': 6,
        '差评': 4, '举报': 5, '维权': 5, '315': 7, '消协': 7,
        '赔偿': 5, '道歉': 4, '态度恶劣': 8, '辱骂': 9, '威胁': 8
    };

    const PARTY_B_LEANING_WORDS = {
        '已签收': 8, '不影响使用': 7, '活动解释权': 7, '正常损耗': 7,
        '已提前告知': 8, '用户确认': 7, '按约履行': 8, '合规包装': 7,
        '客观原因': 6, '不可抗力': 7, '天气原因': 6, '交通拥堵': 5,
        '已联系客户': 6, '主动补偿': 6, '已处理': 5, '已解决': 5,
        '平台规则': 6, '超过时限': 7, '无凭证': 7, '恶意退款': 9,
        '仅退款': 8, '白嫖': 8, '已使用': 6, '人为损坏': 8,
        '超出范围': 6, '非质量问题': 7, '个人原因': 6, '不喜欢': 5,
        '已尽告知义务': 8, '配送合规': 7, '出餐正常': 7,
        '差评威胁': 10, '威胁差评': 10, '不退货': 8, '只退款不退货': 10,
        '恶意仅退款': 10, '薅羊毛': 9, '占便宜': 8, '无理取闹': 9,
        '恶意索赔': 10, '敲诈': 10, '恶意评价': 9, '要挟': 9
    };

    const EMOTION_WORDS = {
        '垃圾': 15, '太差': 15, '恶心': 15, '离谱': 12, '无语': 10,
        '绝对': 10, '肯定': 8, '必须': 8, '一定': 8, '简直': 10,
        '太离谱': 15, '太过分': 15, '气死': 15, '呵呵': 12,
        '骗子': 18, '黑心': 18, '无良': 15, '坑人': 12, '不要脸': 20,
        '投诉到底': 15, '告你': 15, '曝光': 12, '差评': 8, '退钱': 10,
        '什么破': 12, '什么垃圾': 15, '太恶心': 15, '忍不了': 12,
        '崩溃': 10, '抓狂': 12, '疯了': 12, '醉了': 8, '服了': 8
    };

    const FACT_PATTERNS = [
        /\d+元/g, /\d+块钱/g, /\d{10,}/g, /\d{1,2}:\d{2}/g,
        /[一二三四五六七八九十百千万]?[\d]*个月?/g,
        /[一二三四五六七八九十百千万]?[\d]*周/g,
        /[一二三四五六七八九十百千万]?[\d]*天/g,
        /[一二三四五六七八九十百千万]?[\d]*小时/g,
        /[一二三四五六七八九十百千万]?[\d]*分钟/g,
        /[一二三四五六七八九十百千万]?[\d]*次/g,
        /[一二三四五六七八九十百千万]?[\d]*回/g,
        /[一二三四五六七八九十百千万]?[\d]*件/g,
        /[一二三四五六七八九十百千万]?[\d]*条/g,
        /[一二三四五六七八九十百千万]?[\d]*个/g,
        /\d{1,2}月\d{1,2}日/g,
        /\d{1,2}月/g,
        '截图', '物流', '签收', '客服', '订单',
        '快递', '发货', '退货', '退款', '凭证',
        '聊天记录', '录音', '视频', '照片', '发票',
        '单号', '运单', '配送', '下单时间',
        '详情页', '规则', '平台', '投诉', '赔偿',
        '早上', '晚上', '昨天', '今天', '前天',
        '穿了', '用了', '洗了', '买了', '收到', '拆开', '试穿',
        '试了', '退了', '换了', '联系了', '申请了'
    ];

    // ═══════════════════════════════════════════════════════════
    // 话术模板
    // ═══════════════════════════════════════════════════════════
    const COMPROMISE_TEMPLATES = [
        '建议{higher_fault_label}向对方表达诚挚歉意，并给予适当经济补偿（如优惠券，红包等），另一方接受客观因素的存在，双方互谅互让，握手言和。',
        '建议双方各退一步：{higher_fault_label}主动承担主要责任并提供补偿方案，{lower_fault_label}适当降低诉求预期。以和为贵，维护长期信任关系。',
        '建议{higher_fault_label}在24小时内提出具体补偿方案（退款，换货，优惠券三选一），{lower_fault_label}给予合理响应时间。若协商不成，可申请平台介入。',
        '鉴于双方分差较小，建议以善意推定为原则：{higher_fault_label}做出象征性补偿，{lower_fault_label}不再追究。一次愉快的和解胜过十次投诉。'
    ];

    const SEVERITY_HINT_TEMPLATES = [
        '{higher_fault_label}需注意：当前过错分已接近裁决红线，若后续再发生类似投诉，系统将自动升级为判官模式并可能作出违约判定。',
        '警告：{higher_fault_label}的行为已处于平台服务规范的灰色地带。本次仍适用调解，但请务必整改，否则下次将面临直接裁决。',
        '系统提示：分差已达{gap}分，距离强制裁决仅一步之遥。建议{higher_fault_label}高度重视本次调解机会，积极改正。'
    ];

    const FALLBACK_REASON = (
        '经系统综合分析，本次纠纷双方各执一词，现有信息尚不足以做出精确的责任划分。' +
        '从整体表述来看，双方均有一定道理，也存在各自的不足。' +
        '建议双方本着互谅互让的精神，通过友好协商解决分歧，必要时可申请平台客服介入调解。'
    );

    const FALLBACK_COMPROMISE = (
        '建议双方先冷静下来，各自梳理核心诉求和可接受的底线，' +
        '然后选择一个双方都认可的时间进行坦诚沟通。' +
        '如果自行协商困难，可以申请平台官方客服作为第三方介入调解。'
    );

    // ═══════════════════════════════════════════════════════════
    // 核心函数
    // ═══════════════════════════════════════════════════════════
    function splitParties(text) {
        let partyAText = '';
        let partyBText = '';
        const patternAB = text.split(/[乙B]方?[：:]/);
        if (patternAB.length >= 2) {
            partyAText = patternAB[0].replace(/^[甲A]方?[：:]?\s*/, '').trim();
            partyBText = patternAB.slice(1).join('').trim();
        } else {
            const patternBS = text.split(/(?:卖家|商家|骑手|客服)[：:]/);
            if (patternBS.length >= 2) {
                partyAText = patternBS[0].replace(/^(?:买家|消费者|用户|顾客)[：:]?\s*/, '').trim();
                partyBText = patternBS.slice(1).join('').trim();
            } else {
                partyAText = text.trim();
                partyBText = '';
            }
        }
        return [partyAText, partyBText];
    }

    function calcFactDensity(text) {
        if (!text || text.length === 0) return 0.0;
        const totalChars = text.replace(/ /g, '').replace(/\n/g, '').length;
        if (totalChars === 0) return 0.0;
        let factChars = 0;
        for (const pattern of FACT_PATTERNS) {
            if (pattern instanceof RegExp) {
                const matches = text.match(pattern);
                if (matches) {
                    for (const m of matches) {
                        factChars += m.length;
                    }
                }
            } else {
                const count = (text.match(new RegExp(pattern, 'g')) || []).length;
                factChars += pattern.length * count;
            }
        }
        const allKeywords = new Set([
            ...Object.keys(PARTY_A_LEANING_WORDS),
            ...Object.keys(PARTY_B_LEANING_WORDS),
            ...Object.keys(EMOTION_WORDS)
        ]);
        for (const word of allKeywords) {
            const count = (text.match(new RegExp(word, 'g')) || []).length;
            factChars += word.length * count;
        }
        return factChars / totalChars;
    }

    function calcEmotionIntensity(text) {
        if (!text) return 0;
        let score = 0;
        let hasExtremeWord = false;
        let hasIntensePunctuation = false;
        for (const [word, weight] of Object.entries(EMOTION_WORDS)) {
            const count = (text.match(new RegExp(word, 'g')) || []).length;
            score += count * weight;
        }
        const extremeAdverbs = ['根本', '绝对', '简直', '完全', '压根', '从来', '永远不'];
        for (const adv of extremeAdverbs) {
            if (text.includes(adv)) {
                hasExtremeWord = true;
                score += 12;
            }
        }
        const exclamationCount = (text.match(/[！!]/g) || []).length;
        score += exclamationCount * 5;
        const multiExcl = text.match(/[！!]{2,}/g);
        if (multiExcl) {
            hasIntensePunctuation = true;
            score += multiExcl.length * 15;
        }
        const multiQuestion = text.match(/[？?]{2,}/g);
        if (multiQuestion) {
            hasIntensePunctuation = true;
            score += multiQuestion.length * 10;
        }
        if (hasExtremeWord && hasIntensePunctuation) {
            score = Math.floor(score * 2);
        }
        const capsWords = text.match(/[A-Z]{3,}/g);
        if (capsWords) {
            score += capsWords.length * 5;
        }
        return Math.min(score, 100);
    }

    function calcFaultScore(partyAText, partyBText) {
        let faultA = 30;
        let faultB = 30;

        // 判断谁先引发纠纷
        if (['送错', '发错', '漏发', '破损', '质量问题'].some(kw => partyBText.includes(kw))) {
            faultB += 20;
            faultA -= 10;
            if (partyAText.includes('差评') && partyAText.includes('威胁')) {
                faultA += 10;
            }
        }

        // 消费者（甲方）减分项
        if (['开箱视频', '截图', '照片', '录像', '录音', '聊天记录', '物流记录'].some(kw => partyAText.includes(kw))) {
            faultA -= 20;
        }
        if (['三包', '七天无理由', '消费者权益', '平台规则', '法律规定'].some(kw => partyAText.includes(kw))) {
            faultA -= 15;
        }
        if (['退货', '退款', '换货', '维修'].some(kw => partyAText.includes(kw)) &&
            !['一个月', '两个月', '穿过了', '洗了'].some(kw => partyAText.includes(kw))) {
            faultA -= 10;
        }
        if (['请', '谢谢', '理解', '麻烦'].some(kw => partyAText.includes(kw))) {
            faultA -= 5;
        }

        // 消费者（甲方）加分项
        if (partyAText.includes('仅退款') && partyAText.includes('不退货')) {
            faultA += 30;
        }
        if (partyAText.includes('差评') && partyAText.includes('威胁')) {
            faultA += 25;
        }
        if (partyAText.includes('曝光')) {
            faultA += 20;
        }
        if (partyAText.includes('投诉') && partyAText.includes('工商')) {
            faultA += 15;
        }
        if (['一个月', '两个月', '穿了', '洗了', '用了'].some(kw => partyAText.includes(kw))) {
            faultA += 20;
        }
        const emotionA = calcEmotionIntensity(partyAText);
        const densityA = calcFactDensity(partyAText);
        if (emotionA >= 70 && densityA < 0.05) {
            faultA += 10;
        }

        // 商家（乙方）减分项
        if (['详情页', '平台规则', '退换货周期', '签收后不支持'].some(kw => partyBText.includes(kw))) {
            faultB -= 15;
        }
        if (['补偿', '优惠券', '部分退款', '换货', '维修'].some(kw => partyBText.includes(kw))) {
            faultB -= 20;
        }
        if (['申请平台介入', '走售后流程', '提交证据'].some(kw => partyBText.includes(kw))) {
            faultB -= 10;
        }

        // 商家（乙方）加分项
        if (['找快递', '不关我们事', '不是我们的责任', '厂家'].some(kw => partyBText.includes(kw))) {
            faultB += 30;
        }
        if (['白嫖', '薅羊毛', '占便宜', '找茬', '想占便宜'].some(kw => partyBText.includes(kw))) {
            faultB += 25;
        }
        if (['自付运费', '折旧费', '自己联系', '自己承担'].some(kw => partyBText.includes(kw))) {
            faultB += 20;
        }
        if (['随便投诉', '去告', '不怕', '别废话'].some(kw => partyBText.includes(kw))) {
            faultB += 25;
        }

        faultA = Math.max(5, Math.min(95, faultA));
        faultB = Math.max(5, Math.min(95, faultB));
        return [faultA, faultB];
    }

    function detectPartyLabels(partyAText, partyBText) {
        const fullText = partyAText + partyBText;
        let labelA = '消费者（买家）';
        let labelB = '商家（卖家）';
        if (fullText.includes('骑手') || fullText.includes('配送') || fullText.includes('外卖')) {
            labelB = '商家/骑手';
        }
        if (fullText.includes('客服') && fullText.includes('态度')) {
            labelB = '商家客服';
        }
        return [labelA, labelB];
    }

    function extractKeyIssues(partyAText, partyBText, faultA, faultB) {
        const issues = [];
        if (faultB > faultA) {
            for (const word of ['质量问题', '假货', '虚假宣传', '货不对板', '拒绝退款',
                         '态度恶劣', '售后不理', '食品安全', '破损', '洒了',
                         '缺斤少两', '过期', '变质', '异物']) {
                if (partyAText.includes(word)) {
                    issues.push(word);
                }
            }
        } else {
            for (const word of ['恶意退款', '仅退款', '已签收', '人为损坏',
                         '无凭证', '超过时限', '非质量问题']) {
                if (partyBText.includes(word)) {
                    issues.push(word);
                }
            }
        }
        if (issues.length === 0) {
            issues.push('未能充分履行交易义务', '沟通处理不当');
        }
        return issues.slice(0, 3);
    }

    function selectTemplate(templates, indexSeed) {
        return templates[indexSeed % templates.length];
    }

    function generateReason(mode, gap, emotionA, emotionB, faultA, faultB, labelA, labelB, partyAText, partyBText) {
        const issues = extractKeyIssues(partyAText, partyBText, faultA, faultB);
        const keyIssuesStr = issues.length > 0 ? issues.join('、') : '沟通与履约细节';

        if (mode === 'mediator') {
            const templates = [
                `本次纠纷中，${labelA}与${labelB}在${keyIssuesStr}方面存在分歧。从过错分来看，双方责任较为接近（分差仅${gap}分），属于典型的沟通不畅或轻微过失型矛盾。系统建议双方优先以协商方式解决，避免因情绪激化导致争议升级。`,
                `经系统分析，${labelA}与${labelB}的核心分歧在于对${keyIssuesStr}的认知差异。双方过错分分别为${faultA}和${faultB}，分差${gap}分，表明责任归属尚存争议空间。建议双方基于事实和规则，寻找互利共赢的解决方案。`,
                `本次纠纷中，${labelA}的诉求与${labelB}的回应在${keyIssuesStr}方面存在一定摩擦。过错分对比为${faultA}:${faultB}，分差${gap}分，未达到明显失衡阈值。系统建议双方以和为贵，通过理性沟通化解分歧。`
            ];
            if (emotionA > 70 || emotionB > 70) {
                return templates[0];
            } else if (gap > 15) {
                return templates[1];
            } else {
                return templates[2];
            }
        } else {
            let primary, secondary, primaryScore, secondaryScore, primaryRatio;
            if (faultB > faultA) {
                primary = labelB;
                secondary = labelA;
                primaryScore = faultB;
                secondaryScore = faultA;
                primaryRatio = Math.round(faultB / (faultA + faultB) * 100);
            } else {
                primary = labelA;
                secondary = labelB;
                primaryScore = faultA;
                secondaryScore = faultB;
                primaryRatio = Math.round(faultA / (faultA + faultB) * 100);
            }
            return (
                `系统对双方陈述进行了多维度分析，结果显示：\n` +
                `■ 过错分对比：${labelA} ${faultA}分，${labelB} ${faultB}分，分差${gap}分。\n` +
                `■ 责任倾向：${primary} 的过错分高于${secondary}，责任倾向相对明显（${primaryRatio}%）。\n` +
                `■ 关键分歧：集中在${keyIssuesStr}。\n` +
                `■ 综合判断：本次纠纷中，${primary} 在${keyIssuesStr}方面存在较明显不足，应承担主要责任；${secondary} 亦有部分过失，但程度较轻。\n` +
                `建议双方正视责任分配，${primary} 主动采取补救措施，${secondary} 给予合理配合，以达成公平解决。`
            );
        }
    }

    function generateCompromise(gap, faultA, faultB, labelA, labelB) {
        const seed = (gap + faultA + faultB) % 100;
        const template = selectTemplate(COMPROMISE_TEMPLATES, seed);
        const higherFaultLabel = faultA >= faultB ? labelA : labelB;
        const lowerFaultLabel = faultA >= faultB ? labelB : labelA;
        return template
            .replace(/{higher_fault_label}/g, higherFaultLabel)
            .replace(/{lower_fault_label}/g, lowerFaultLabel);
    }

    function generateVerdict(faultA, faultB, labelA, labelB, partyAText, partyBText) {
        const total = faultA + faultB;
        let ratioA, ratioB;
        if (total === 0) {
            ratioA = 50;
            ratioB = 50;
        } else {
            ratioA = Math.round(faultA / total * 100);
            ratioB = 100 - ratioA;
        }

        let primary, secondary, primaryScore, secondaryScore, primaryRatio, secondaryRatio;
        if (faultB > faultA) {
            primary = labelB;
            secondary = labelA;
            primaryScore = faultB;
            secondaryScore = faultA;
            primaryRatio = ratioB;
            secondaryRatio = ratioA;
        } else {
            primary = labelA;
            secondary = labelB;
            primaryScore = faultA;
            secondaryScore = faultB;
            primaryRatio = ratioA;
            secondaryRatio = ratioB;
        }

        const issues = extractKeyIssues(partyAText, partyBText, faultA, faultB);
        const issuesStr = issues.length > 0 ? issues.join('；') : '沟通与履约存在瑕疵';

        let tendency, recommendation;
        if (primaryScore - secondaryScore >= 40) {
            tendency = '明显';
            recommendation = `建议${primary}主动承担主要责任，${secondary}予以必要配合。`;
        } else if (primaryScore - secondaryScore >= 20) {
            tendency = '较为明显';
            recommendation = `建议${primary}积极回应，${secondary}保持理性沟通，共同协商解决方案。`;
        } else {
            tendency = '轻微';
            recommendation = '建议双方互谅互让，以补偿代问责，避免争议升级。';
        }

        return (
            `【责任认定报告】\n` +
            `经系统综合评估，本次纠纷中双方均存在一定责任，但责任程度有所不同。\n\n` +
            `■ 责任倾向分析：\n` +
            `  • ${primary} 过错分为 ${primaryScore}，占总过错比例的 ${primaryRatio}%；\n` +
            `  • ${secondary} 过错分为 ${secondaryScore}，占总过错比例的 ${secondaryRatio}%。\n` +
            `  综合判断，${primary} 的责任倾向 **${tendency}** 更高。\n\n` +
            `■ 核心争议点：\n` +
            `  ${issuesStr}\n\n` +
            `■ 处理建议：\n` +
            `  ${recommendation}\n` +
            `  - ${primary} 应就 ${issuesStr} 中的主要部分承担责任；\n` +
            `  - ${secondary} 亦需审视自身在沟通/履约中的不足。\n\n` +
            `注：本报告基于双方陈述文本生成，仅供参考，不构成具有法律效力的裁决。`
        );
    }

    function generateSeverityHint(gap, faultA, faultB, labelA, labelB) {
        const seed = (gap + faultA) % 100;
        const template = selectTemplate(SEVERITY_HINT_TEMPLATES, seed);
        const higherFaultLabel = faultA >= faultB ? labelA : labelB;
        return template
            .replace(/{higher_fault_label}/g, higherFaultLabel)
            .replace(/{gap}/g, gap);
    }

    function buildInsufficient(message) {
        return {
            success: true,
            data: {
                mode: 'insufficient',
                fault_score: null,
                gap: null,
                emotion_intensity: null,
                credibility_note: null,
                compromise_suggestion: null,
                severity_hint: null,
                winner: null,
                verdict: null,
                reason: null,
                party_labels: null,
                message: message
            }
        };
    }

    function analyzeText(text) {
        if (!text || text.trim().length < 10) {
            return buildInsufficient('还没有看到纠纷描述哦，请把双方的聊天记录或投诉内容粘贴进来。');
        }
        const cleaned = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
        if (cleaned.length < 5) {
            return buildInsufficient('信息似乎跑偏了，请重新描述一下双方的争执焦点哦。');
        }
        const uniqueChars = new Set(cleaned);
        if (uniqueChars.size <= 2 && cleaned.length > 0) {
            return buildInsufficient('信息似乎跑偏了，请重新描述一下双方的争执焦点哦。');
        }

        const [partyAText, partyBText] = splitParties(text);
        const [faultA, faultB] = calcFaultScore(partyAText, partyBText);
        const emotionA = calcEmotionIntensity(partyAText);
        const emotionB = calcEmotionIntensity(partyBText);
        const gap = Math.abs(faultA - faultB);
        const [labelA, labelB] = detectPartyLabels(partyAText, partyBText);
        const mode = gap > 30 ? 'judge' : 'mediator';

        let credibilityA = null;
        let credibilityB = null;
        if (emotionA >= 70 && faultA <= 20) {
            credibilityA = '该方情绪表达激烈，但缺乏事实支撑';
        }
        if (emotionB >= 70 && faultB <= 20) {
            credibilityB = '该方情绪表达激烈，但缺乏事实支撑';
        }

        let reason = generateReason(mode, gap, emotionA, emotionB, faultA, faultB, labelA, labelB, partyAText, partyBText);

        const allKeywords = [...Object.keys(PARTY_A_LEANING_WORDS), ...Object.keys(PARTY_B_LEANING_WORDS)];
        let totalKeywordHits = 0;
        for (const w of allKeywords) {
            totalKeywordHits += (text.match(new RegExp(w, 'g')) || []).length;
        }
        if (totalKeywordHits <= 1) {
            reason = FALLBACK_REASON;
        }

        let compromiseSuggestion = null;
        let severityHint = null;
        let winner = null;
        let verdict = null;

        if (mode === 'mediator') {
            compromiseSuggestion = generateCompromise(gap, faultA, faultB, labelA, labelB);
            if (totalKeywordHits <= 1) {
                compromiseSuggestion = FALLBACK_COMPROMISE;
            }
            if (gap > 20 && gap <= 30) {
                severityHint = generateSeverityHint(gap, faultA, faultB, labelA, labelB);
            }
        } else {
            winner = faultB > faultA ? 'party_a' : 'party_b';
            verdict = generateVerdict(faultA, faultB, labelA, labelB, partyAText, partyBText);
        }

        return {
            success: true,
            data: {
                mode: mode,
                fault_score: { party_a: faultA, party_b: faultB },
                gap: gap,
                emotion_intensity: { party_a: emotionA, party_b: emotionB },
                credibility_note: { party_a: credibilityA, party_b: credibilityB },
                compromise_suggestion: compromiseSuggestion,
                severity_hint: severityHint,
                winner: winner,
                verdict: verdict,
                reason: reason,
                party_labels: { party_a: labelA, party_b: labelB },
                message: null
            }
        };
    }

    // ═══════════════════════════════════════════════════════════
    // 前端交互逻辑
    // ═══════════════════════════════════════════════════════════
    const inputText = document.getElementById('inputText');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const placeholder = document.getElementById('placeholder');
    const resultContent = document.getElementById('resultContent');
    const reportBox = document.getElementById('reportBox');
    let emotionChartInstance = null;
    let faultChartInstance = null;

    clearBtn.addEventListener('click', function() {
        inputText.value = '';
    });

    analyzeBtn.addEventListener('click', function() {
        const text = inputText.value.trim();
        if (!text) {
            alert('请先输入纠纷描述内容！');
            return;
        }
        this.disabled = true;
        this.innerHTML = '<span class="spinner"></span> 分析中…';

        // 模拟异步分析（实际是同步的，加一点延迟让用户有感知）
        setTimeout(() => {
            try {
                const result = analyzeText(text);
                if (result.success && result.data) {
                    renderResult(result.data);
                } else {
                    alert('分析失败，请稍后重试');
                }
            } catch (err) {
                alert('分析出错：' + err.message);
                console.error(err);
            } finally {
                this.disabled = false;
                this.innerHTML = '⚖️ 一键分析';
            }
        }, 300);
    });

    function renderResult(data) {
        placeholder.style.display = 'none';
        resultContent.style.display = 'block';

        const mode = data.mode;
        const faultA = data.fault_score?.party_a || 0;
        const faultB = data.fault_score?.party_b || 0;
        const emotionA = data.emotion_intensity?.party_a || 0;
        const emotionB = data.emotion_intensity?.party_b || 0;
        const gap = data.gap || 0;

        renderCharts(emotionA, emotionB, faultA, faultB);

        let html = '';

        // 模式徽章
        let badgeClass = 'badge-insufficient';
        let badgeText = '信息不足';
        if (mode === 'mediator') {
            badgeClass = 'badge-mediator';
            badgeText = '🤝 调解模式';
        } else if (mode === 'judge') {
            badgeClass = 'badge-judge';
            badgeText = '📋 责任认定模式';
        }
        html += `<div class="mode-badge ${badgeClass}">${badgeText}</div>`;

        // 过错分
        if (data.fault_score) {
            html += `<div class="score-display">
                <div class="score-item"><span style="color:#3498db;">消费者</span><br>过错分 <span class="num" style="color:#3498db;">${faultA}</span></div>
                <div class="score-item"><span style="color:#e67e22;">商家</span><br>过错分 <span class="num" style="color:#e67e22;">${faultB}</span></div>
                <div class="score-item">分差 <span class="num" style="color:#e74c3c;">${gap}</span></div>
            </div>`;
        }

        // 内容
        if (mode === 'insufficient') {
            html += `<div class="insufficient-box">${data.message || '信息不足'}</div>`;
        } else {
            if (data.reason) {
                html += `<div class="reason-text">💬 ${data.reason}</div>`;
            }
            if (mode === 'mediator') {
                if (data.compromise_suggestion) {
                    html += `<div class="suggestion-text">💡 调解建议：${data.compromise_suggestion}</div>`;
                }
                if (data.severity_hint) {
                    html += `<div class="warning-hint">⚠️ ${data.severity_hint}</div>`;
                }
            } else if (mode === 'judge') {
                if (data.verdict) {
                    let reportText = data.verdict.replace('【裁定书】', '📋 责任认定报告');
                    html += `<div class="verdict-report">${reportText}</div>`;
                }
                if (data.winner) {
                    const winnerName = data.winner === 'party_a' ? '消费者' : '商家';
                    html += `<div class="liability-tag">
                        <strong>📌 责任倾向：</strong> ${winnerName} 的责任倾向相对较低，诉求获得支持
                    </div>`;
                }
            }
        }

        reportBox.innerHTML = html;
    }

                    { value: faultB, itemStyle: { color: '#e67e22', borderRadius: [6, 6, 0, 0] } }
                ],
                barWidth: 48,

                    position: 'top',
                    fontWeight: 600,
                    fontSize: 14
                }
            }]
        });
        faultChartInstance.resize();
    }

    window.addEventListener('resize', function() {
        if (emotionChartInstance) emotionChartInstance.resize();
        if (faultChartInstance) faultChartInstance.resize();
    });
    </script>
